armor_detector {
    type = "TensorRTDetector"
    debugView = false
    onnxPath = "data/weights/armor_detect/2024-07-19.onnx"
    numThresh = 0.7
    image_frame_atom = ["server"]
    armor_detect_available_atom = ["drawer", "armor_locator"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1]
    detect_available_atom = ["strategy"]
}

strategy {
    type = "InfantryStrategy"
    set_target_atom = ["predictor"]
}


predictor {
  type = "CarPredictor"
  debugView = false
  enablePredictor = true
  enableFixYaw = true
  maxMatchDist = 0.3
  trackingThreshold = 5
  lostThreshold = 50
  maxMatchYaw = 0.7
  sigma2Qxyz = 20
  sigma2Qyaw = 20
  sigma2QR = 800
  Rxyz = 0.1
  Ryaw = 0.02
  car_predict_atom = ["solver"]
  car_predict_view_atom = ["drawer"]
}

solver {
    type = "AngleSolver"
    debugView = true
    delay = 0.1
    angle_solver_view_atom = ["drawer"]
    set_target_info_atom = ["serial"]
}

serial {
    type = "InfantrySerialPort"
    devPath = "/dev/ttyACM0"
    baudRate = 921600
    update_head_atom = ["camera"]
    update_posture_atom = ["predictor"]
}

recorder {
  type = "VideoRecorder"
  base = "record"
  segmentLength = 30.0
  fps = 60.0
}