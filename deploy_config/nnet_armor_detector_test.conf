camera {
    type = "DahengDriver"
    openMode = "Index"
    identifier = 1
    fps = 210.0
    fov = 30.0
    exposureTime = 0.005
    dy = 0.05 # TODO
    dz = -0.06 # TODO 
    gain = 6 
    image_frame_atom = ["armor_detector","server"]
    # image_frame_atom = ["armor_detector","server", "recorder"]
}

armor_detector {
    type = "NNetArmorDetector"
    networkPath = "data/weights/armor_detect/opt-0625-001.onnx"  #network training file path
    inputWidth = 416
    inputHeight = 416
    numClasses = 8 #Number of classes
    numColors = 4  #Number of color
    bboxConfThresh = 0.6
    topK = 128
    nmsThresh = 0.01
    fftConfError = 0.15
    fftMinIou = 0.9
    maxArmorRatio = 4.0
    maxBarAngleDiff = 15.0
    armor_nnet_detect_available_atom = ["drawer"]
    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

server {
    type = "HttpServer"
}

