camera {
  type = "DahengDriver"
  openMode = "Index"
  identifier = 1
  fps = 210.0
  fov = 30.0
  exposureTime = 0.0005

  dx = 0.056 # TODO
  dy = 0.065 # TODO
  dz = -0.130224 # TODO
  pitch = -20 #TODO

#   dx = 0 #TODO
#   dy = 0.0695 #TODO
#   dz = -0.09445 #TODO
#   pitch = 0 #TODO

  enableAutoWhiteBalance = true
  image_frame_atom = ["armor_detector","server","recorder"]
#  image_frame_atom = ["armor_detector","server"]
}

armor_detector {
    type = "ArmorDetector"
    debugView = false
    binaryThresh = 100
    maxLightLen = 200
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 5.0       # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 5.0   # width/height
    maxArmorAngle = 15       # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "data/weights/armor_classify/cls_num.onnx"
    numProbThresh = 0.6
    armor_detect_available_atom = ["armor_locator", "drawer"]
    image_frame_atom = ["server"]
}

