global {
#     gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
#     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = true
}

server {
    type = "HttpServer"
}
camera {
    type = "DahengDriver"
    openMode = "Index"
    identifier = 1
    fps = 210.0
    fov = 23.0
    exposureTime = 0.001
    dx = -0.06
    dy = 0.05
    dz = -0.06
    image_frame_atom = ["detector","server"]
}

detector {
    type = "FakeCarDetector"
    car_detect_available_atom = ["armor_detector"]
}

armor_detector {
    type = "ArmorDetector"
    globalScale = 1.0
    thresholdForBlue = [120,256,256]
    thresholdForRed = [40,256,256]
    maxAreaRatio = 2.0
    maxLightAngle = 0.3
    maxLightRectRatio = 10.0
    maxArmorRectRatio = 0.5
    maxArmorAngle = 0.8
    minLightBaseAngle = 0.3
    maxParallelAngle = 0.7
    minLightHeightRatio = 0.6
    armor_detect_available_atom = ["armor_locator", "drawer"]
    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    detect_available_atom = ["strategy"]
}

strategy {
    type = "HeroStrategy"
    distanceThreshold = 0.0
    set_target_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    precision = 0.001
    delay = -0.2
    set_target_info_atom = ["serial"]
}

serial {
    type = "SerialPort"
    devPath = "/dev/ttyUSB0"
    baudRate = 921600
    update_head_atom = ["solver"]
    update_posture_atom = ["solver"]
}
