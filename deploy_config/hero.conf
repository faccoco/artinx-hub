armor_locator {
  type = "ArmorLocator"
  largeArmor = [1,7]
  detect_available_atom = ["strategy"]
}

predictor {
  type = "CarPredictor"
  enablePredictor = true
  maxMatchDistance = 0.2
  trackingThreshold = 5
  lostThreshold = 50
      #xc    yc    zc    yaw   vxc   vyc   vzc   vyaw  r
  Q = [1e-2, 1e-2, 1e-2, 2e-2, 0.005, 1e-4, 0.005, 4e-2, 1e-3]
      #xa    ya    za    yaw
  R = [0.0009, 0.0009, 0.0025, 0.0036]
  predict_success_atom = ["solver"]
}
periodPredictor{
  type = "PeriodPredictor"
  period_predict_success_atom = ["periodSolver"]
}
periodOutpostPredictor{
  type = "PeriodOutpostPredictor"
  period_predict_success_atom = ["periodSolver"]
}
solver {
  type = "AngleSolver"
  delay = 0.0
  set_target_info_atom = ["serial"]
}
periodSolver {
  type = "PeriodSolver"
  precision = 0.007
  delay = 0.015
  set_target_info_atom = ["serial"]
  headDelay = 0.1
}
strategy {
  type = "HeroStrategy"
  periodPredictType = "outpost"
  set_target_atom = ["predictor"]
  set_period_target_atom = ["periodPredictor"]
  set_period_outpost_atom = ["periodOutpostPredictor"]
}

serial {
  type = "SerialPort"
  devPath = "/dev/ttyUSB0"
  baudRate = 921600
  minBulletSpeed = 7.0
  maxBulletSpeed = 16.0
  # enableEnergyControl = true
  # energy_detector_control_atom = ["strategy","energy_detector"]
  getBulletSpeedFromSerial = true
  getOutpostModeFromSerial = true
  getShootDelayFromSerial = true
  update_head_atom = ["camera"]
  update_posture_atom = ["predictor"]
  outpost_detector_control_atom = ["strategy","periodSolver"]
}

server {
  type = "HttpServer"
}

drawer {
  type = "ArmorDetectorDrawer"
  image_frame_atom = ["server"]
}

recorder {
  type = "VideoRecorder"
  base = "record"
  segmentLength = 15.0
  fps = 60.0
}

server {
  type = "HttpServer"
}