armor_detector {
    type = "ArmorDetector"
    debugView = false
    binaryThresh = 100                                                      
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 30.0       # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    max2LightDiffAngle = 7.0
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 11.0   # width/height
    maxArmorAngle = 20       # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "/home/artinx/workspace/artinx-hub/data/weights/armor_classify/mlp.onnx"
    numProbThresh = 0.7
    armor_detect_available_atom = ["drawer", "armor_locator"]
    # armor_detect_available_atom = ["drawer"]

    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1]
    detect_available_atom = ["strategy"]
}

strategy {
    type = "InfantryStrategy"
    set_target_atom = ["predictor"]
}


predictor {
  type = "CarPredictor"
  enablePredictor = true
  maxMatchDist = 0.20
  trackingThreshold = 5
  lostThreshold = 50
  maxMatchYaw = 0.8
  sigma2Qxyz = 20
  sigma2Qyaw = 100
  sigma2QR = 800
  Rxyz = 0.05
  Ryaw = 0.1
  car_predict_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    delay = 0.08
    set_target_info_atom = ["serial"]
}

serial {
    type = "InfantrySerialPort"
    devPath = "/dev/ttyACM0"
    baudRate = 921600
    update_head_atom = ["camera"]
    update_posture_atom = ["predictor"]
}

