global {
#   gForce = -9.8 # General
  gForce = -9.7949 # Nanjing(near to Changzhou)
#   gForce = -9.7833 # Guangzhou(near to Shenzhen)
  dragCoefficient = 0.0
  bullet42mm = true
  defaultBulletSpeed = 13.6
}

