global {
#     gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
#     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

server {
    type = "HttpServer"
    ethName = "eth0"
}

camera {
    type = "DahengDriver"
    openMode = "Index"
    identifier = 1
    fps = 130.0
    fov = 30.0
    enableAutoWhiteBalance = false
    exposureTime = 0.0030
    dy = 0.096 # TODO
    dz = -0.12
    yaw = -0.3
    pitch = -1
    gain = 10
    flip = false
    image_frame_atom = ["armor_detector", "server"]
}

