global {
#     gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
#     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

server {
    type = "HttpServer"
}

camera_up {
    type = "DahengDriver"
    openMode = "SerialNumber"
    identifier = "RS0222008020"
    fps = 120.0
    fov = 48.0
    exposureTime = 0.001
    dy = 0.0448
    dz = -0.06
    flip = true
    image_frame_atom = ["detector_up"]
}
camera_down {
    type = "DahengDriver"
    openMode = "SerialNumber"
    identifier = "RS0225008020"
    fps = 120.0
    fov = 23.0
    exposureTime = 0.001
    dy = 0.0448
    dz = -0.06
    image_frame_atom = ["detector_down"]
}

detector_up {
    type = "FakeCarDetector"
    car_detect_available_atom = ["armor_detector_up"]
}
detector_down {
    type = "FakeCarDetector"
    car_detect_available_atom = ["armor_detector_down"]
}

armor_detector_up {
    type = "ArmorDetector"
    globalScale = 1.0
    thresholdForBlue = [120,256,256]
    thresholdForRed = [40,256,256]
    maxAreaRatio = 2.0
    maxLightAngle = 0.3
    maxLightRectRatio = 10.0
    maxArmorRectRatio = 0.5
    maxArmorAngle = 0.8
    minLightBaseAngle = 0.3
    maxParallelAngle = 0.7
    minLightHeightRatio = 0.6
    armor_detect_available_atom = ["armor_locator_up", "drawer_up"]
    image_frame_atom = ["server"]
}
armor_detector_down {
    type = "ArmorDetector"
    globalScale = 1.0
    thresholdForBlue = [120,256,256]
    thresholdForRed = [40,256,256]
    maxAreaRatio = 2.0
    maxLightAngle = 0.3
    maxLightRectRatio = 10.0
    maxArmorRectRatio = 0.5
    maxArmorAngle = 0.8
    minLightBaseAngle = 0.3
    maxParallelAngle = 0.7
    minLightHeightRatio = 0.6
    armor_detect_available_atom = ["armor_locator_down", "drawer_down"]
    image_frame_atom = ["server"]
}

drawer_up {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}
drawer_down {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator_up {
    type = "ArmorLocator"
    group_id = 0
    detect_available_atom = ["strategy"]
}
armor_locator_down {
    type = "ArmorLocator"
    group_id = 1
    detect_available_atom = ["strategy"]
}

strategy {
    type = "SentryStrategy"
    group_mask = 3
    distanceThreshold = 8.0
    detectedTTL = 0.1
    set_target_atom = ["solver_up","solver_down"]
}

solver_up {
    type = "AngleSolver"
    group_id = 0
    precision = 0.001
    delay = -0.2
    set_target_info_atom = ["serial"]
}
solver_down {
    type = "AngleSolver"
    group_id = 1
    precision = 0.001
    delay = -0.2
    set_target_info_atom = ["serial"]
}

serial {
    type = "SerialPort"
    devPath = "/dev/ttyUSB0"
    baudRate = 921600
    headHeightOffset1 = 0.1804
    headHeightOffset2 = -0.358
    update_head_atom = ["solver_up","solver_down","strategy"]
    update_posture_atom = ["solver_up","solver_down"]
}
