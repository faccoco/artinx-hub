predictor {
  type = "CarPredictor"
  enablePredictor = true
  maxMatchDistance = 0.2
  trackingThreshold = 5
  lostThreshold = 50
      #xc    yc    zc    yaw   vxc   vyc   vzc   vyaw  r
  Q = [1e-2, 1e-2, 1e-2, 2e-2, 0.005, 1e-4, 0.005, 4e-2, 1e-3]
      #xa    ya    za    yaw
  R = [0.0009, 0.0009, 0.0025, 0.0036]
  car_predict_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    precision = 0.001
    delay = 0.20
    bulletSpeedDiscount = 1.0
    set_target_info_atom = ["serial"]
}

serial {
    type = "SerialPort"
    devPath = "/dev/ttyUSB0"
    baudRate = 921600
    minBulletSpeed = 12.0
    maxBulletSpeed = 35.0
    # enableEnergyControl = true
    # energy_detector_control_atom = ["strategy","energy_detector"]
    update_head_atom = ["camera"]
    update_posture_atom = ["predict"]
}

recorder {
    type = "VideoRecorder"
    base = "record"
}
