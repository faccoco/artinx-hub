armor_detector {
    type = "NNetArmorDetector"
    networkPath = "data/weights/armor_detect/opt-0625-001.onnx"  #network training file path
    inputWidth = 416
    inputHeight = 416
    numClasses = 8 #Number of classes
    numColors = 4  #Number of color
    bboxConfThresh = 0.6
    topK = 128
    nmsThresh = 0.01
    binaryThresh = 100
    numClassifyModelPath = "data/weights/armor_classify/mlp.onnx"
    armor_detect_available_atom = ["drawer"]
    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1]
    detect_available_atom = ["strategy"]
}

strategy {
    type = "SentryStrategy"
    ignoredId = [6, 2]
    maxDistance = 8.0
    set_target_atom = ["predictor"]
}

