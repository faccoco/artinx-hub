predictor {
  type = "CarPredictor"
  enablePredictor = true
  maxMatchDistance = 0.2
  trackingThreshold = 5
  lostThreshold = 20
          #xc    yc       zc     yaw     vxc     vyc    vzc      vyaw     r
  Q = [0.0100, 0.0020, 0.0100, 0.0040, 0.0800, 0.0004 , 0.0800, 0.040, 0.0025]
          #xa    ya       za    yaw
  R = [0.0006, 0.0006, 0.0006, 0.0018]
  car_predict_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    delay = 0.01
}
server {
    type = "HttpServer"
}


