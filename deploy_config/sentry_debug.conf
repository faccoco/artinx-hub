armor_detector {
    type = "ArmorDetector"
    debugView = false
    binaryThresh = 80
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 5.0       # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 5.0   # width/height
    maxArmorAngle = 15       # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "data/weights/armor_classify/cls_num.onnx"
    numProbThresh = 0.5
    armor_detect_available_atom = ["drawer", "armor_locator"]
    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1, 4]
    detect_available_atom = ["strategy"]
}

strategy {
    type = "SentryStrategy"
    ignoredId = [0, 2]
    maxDistance = 8.0
    set_target_atom = ["predict"]
}

predict{
    type = "ArmorPredictor"
    enablePredictor = true
    P = [0.05, 0.03, 0.1, 1.5, 1.5, 1.5]
    Q = [0.001, 0.001, 0.003, 1.2, 1.2, 1.2]
    R = [0.011206584, 0.0045113561, 0.0240242645488644]
    predict_success_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    precision = 0.001
    delay = 0.20
    bulletSpeedDiscount = 1.0
    set_target_info_atom = ["serial"]
}

serial {
    type = "SerialPort"
    devPath = "/dev/ttyUSB0"
    baudRate = 921600
    # enableEnergyControl = true
    # energy_detector_control_atom = ["strategy","energy_detector"]
    update_head_atom = ["camera"]
    update_posture_atom = ["predict"]
}
