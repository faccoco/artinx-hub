global {
#     gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
#     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

camera {
    type = "DahengDriver"
    openMode = "Index"
    identifier = 1
    fps = 210.0
    fov = 30.0
    enableAutoWhiteBalance = true
    exposureTime = 0.005
    dy = -0.03 # TODO
    dx = -0.03 # TODO
    pitch = 1.0
    image_frame_atom = ["armor_detector","recorder"]
}

armor_detector {
    type = "ArmorDetector"
    debugView = false
    binaryThresh = 100
    maxLightLen = 200
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 5.0       # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 5.0   # width/height
    maxArmorAngle = 15       # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "data/weights/armor_classify/cls_num.onnx"
    numProbThresh = 0.7
    armor_detect_available_atom = ["armor_locator"]
}


