global {
#     gForce = -9.8 # General
#    gForce = -9.7949 # Nanjing(near to Changzhou)
     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

camera {
    type = "DahengDriver"
    openMode = "Index"
    identifier = "1"
    cameraName = "Camera"
    enableAutoWhiteBalance = true
    fps = 150
    fov = 30.0
    flip = false
    gain = 12.0
    exposureTime = 0.006
    gain = 15
    dy = -0.07 # TODO
    dz = -0.15 # TODO
    yaw = 0
    pitch = -1 #degree
    image_frame_atom = ["armor_detector", "recorder","server"]
}


