armor_detector {
    type = "ArmorDetector"
    debugView = true
    binaryThresh = 100
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 20.0       # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    max2LightDiffAngle = 20.0
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 8.0   # width/height
    maxArmorAngle = 30       # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "data/weights/armor_classify/mlp.onnx"
    numProbThresh = 0.8
    armor_detect_available_atom = ["drawer", "armor_locator"]
    image_frame_atom = ["server"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1]
    detect_available_atom = ["strategy"]
}

strategy {
    type = "InfantryStrategy"
    set_target_atom = ["predictor"]
}

predictor {
  type = "CarPredictor"
  enablePredictor = true
  maxMatchDist = 0.20
  trackingThreshold = 5
  lostThreshold = 100
  maxMatchYaw = 0.7
  sigma2Qxyz = 20
  sigma2Qyaw = 100
  sigma2QR = 800
  Rxyz = 0.1
  Ryaw = 0.02
  car_predict_atom = ["solver"]
}

solver {
    type = "AngleSolver"
    delay = 0.04
    set_target_info_atom = ["serial"]
}

serial {
    type = "AerialSerialPort"
    devPath = "/dev/ttyACM0"
    baudRate = 921600
    update_head_atom = ["camera"]
    update_posture_atom = ["predictor"]
}

recorder {
  type = "VideoRecorder"
  base = "record"
  segmentLength = 30.0
  fps = 60.0
}

server {
  type = "HttpServer"
  ethName = "l4tbr0"
}

drawer {
  type = "ArmorDetectorDrawer"
  image_frame_atom = ["server"]
}
