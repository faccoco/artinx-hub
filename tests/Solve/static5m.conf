global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 15.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 12.0
  bulletCount = 100

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 0.0

  standardDistance = 5.0
  sourceHeight = 0.15
  targetHeight = 0.15

  targetType = "Infantry"
  targetMotionType = "Static"
  sourceMotionType = "Static"

  expectedCount = 95
  
  headHeightOffset = 0.2

  simulator_step_atom = ["detector"]
  update_head_atom = ["detector"]
  update_posture_atom = ["predictor"]
}
detector {
  type = "FakeDetector"
  
  detect_available_atom = ["strategy"]
}

predictor {
  type = "ArmorPredictor"
  enablePredictor = true
  maxMatchDistance = 0.2
  trackingThreshold = 5
  lostThreshold = 5
      #xc    yc    zc    yaw   vxc   vyc   vzc   vyaw  r
  Q = [1e-2, 1e-2, 1e-2, 2e-2, 5e-2, 1e-4, 5e-2, 4e-2, 1e-3]
      #xa    ya    za    yaw
  R = [1e-1, 1e-1, 1e-1, 2e-1]
  predict_success_atom = ["solver"]
}
solver {
  type = "AngleSolver"
  delay = 0.0
  set_target_info_atom = ["simulator"]
}
strategy {
  type = "SimpleStrategy"
  set_target_atom = ["predictor"]
}