global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 15.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 12.0
  bulletCount = 100

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 1.25

  standardDistance = 3.0
  sourceHeight = 0.15
  targetHeight = 0.15

  targetType = "Infantry"
  targetMotionType = "Spinning"
  sourceMotionType = "Static"

  expectedCount = 0
  
  headHeightOffset = 0.2

  simulator_step_atom = ["detector"]
  update_head_atom = ["detector"]
  update_posture_atom = ["predictor"]
}
detector {
  type = "FakeDetector"
  
  detect_available_atom = ["strategy"]
}

predictor {
    type = "ArmorPredictor"
    enablePredictor = false
    maxResidual = 1.0
    P = [0.05, 0.03, 0.1, 1.5, 1.5, 1.5]
    Q = [0.001, 0.001, 0.003, 0.001, 0.001, 0.003]
    R = [0.011206584, 0.0045113561, 0.0240242645488644]
    predict_success_atom = ["solver"]
}
solver {
  type = "AngleSolver"
  precision = 0.005
  delay = 0.0
  set_target_info_atom = ["simulator"]
}
strategy {
  type = "SimpleStrategy"
  set_target_atom = ["predictor"]
}