global {
  gForce = -9.8
  dragCoefficient = 0.5
  airDensity = 1.293
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 15.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 12.0
  bulletCount = 10

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 0.2

  standardDistance = 5.0
  targetAngle = 90
  sourceHeight = 0.15
  targetHeight = 1.166

  targetType = "Outpost"
  targetMotionType = "Spinning"
  sourceMotionType = "Static"

  expectedCount = 9

  printBulletInfo = true

  simulator_step_atom = ["detector","head","imu"]
}
detector {
  type = "FakeDetector"
  
  detect_available_atom = ["strategy"]
}
imu {
  type = "FakeIMU"
  
  update_posture_atom = ["predictor"]
}
head {
  type = "FakeHead"
  headHeightOffset = 0.2
  
  update_head_atom = ["simulator","detector"]
}

predictor {
  type = "ArmorPredictor"
  enablePredictor = false
  predict_success_atom = ["solver"]
}
outpostPredictor{
  type = "OutpostPredictor"
  outpost_predict_success_atom = ["outpostSolver"]
}
periodPredictor{
  type = "PeriodPredictor"
  period_predict_success_atom = ["periodSolver"]
}
periodOutpostPredictor{
  type = "PeriodOutpostPredictor"
  period_predict_success_atom = ["periodSolver"]
}
solver {
  type = "AngleSolver"
  precision = 0.005
  delay = 0.0
  set_target_info_atom = ["head","simulator"]
}
outpostSolver {
  type = "OutpostSolver"
  precision = 0.005
  delay = 0.0
  set_target_info_atom = ["head","simulator"]
}
periodSolver {
  type = "PeriodSolver"
  precision = 0.005
  delay = 0.0
  set_target_info_atom = ["head","simulator"]
}
strategy {
  type = "SimpleStrategy"
  # aimType = "Car"
  # aimType = "Outpost"
  # aimType = "Period"
  aimType = "PeriodOutpost"
  set_target_atom = ["predictor"]
  set_outpost_atom = ["outpostPredictor"]
  set_period_target_atom = ["periodPredictor"]
  set_period_outpost_atom = ["periodOutpostPredictor"]
}