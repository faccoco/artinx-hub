global {
  gForce = -9.8
  dragCoefficient = 0.5
  airDensity = 1.293
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 15.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 12.0
  bulletCount = 10

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 0.2

  standardDistance = 5.0
  targetAngle = 90
  sourceHeight = 0.15
  targetHeight = 1.166

  targetType = "Outpost"
  targetMotionType = "Spinning"
  sourceMotionType = "Static"

  expectedCount = 9

  printBulletInfo = true
  
  aimType = "PeriodOutpost"
  
  headHeightOffset = 0.2

  simulator_step_atom = ["detector"]
  update_head_atom = ["detector"]
  update_posture_atom = ["predictor"]
  outpost_detector_control_atom = ["strategy"]
}
detector {
  type = "FakeDetector"
  
  detect_available_atom = ["strategy"]
}

predictor {
  type = "ArmorPredictor"
  enablePredictor = true
  maxMatchDistance = 0.2
  trackingThreshold = 5
  lostThreshold = 5
      #xc    yc    zc    yaw   vxc   vyc   vzc   vyaw  r
  Q = [1e-2, 1e-2, 1e-2, 2e-2, 5e-2, 1e-4, 5e-2, 4e-2, 1e-3]
      #xa    ya    za    yaw
  R = [1e-1, 1e-1, 1e-1, 2e-1]
  predict_success_atom = ["solver"]
}
periodOutpostPredictor{
  type = "PeriodOutpostPredictor"
  period_predict_success_atom = ["periodSolver"]
}
solver {
  type = "AngleSolver"
  delay = 0.0
  set_target_info_atom = ["simulator"]
}
periodSolver {
  type = "PeriodSolver"
  precision = 0.005
  delay = 0.0
  set_target_info_atom = ["simulator"]
}
strategy {
  type = "SimpleStrategy"
  set_target_atom = ["predictor"]
  set_period_outpost_atom = ["periodOutpostPredictor"]
}