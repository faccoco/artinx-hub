<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">

<head>
  <meta charset="utf-8">
  <meta name="author" content="Jony Zhu">
  <meta name="description" content="HTML5 Base Template.">
  <meta name="keywords" content="HTML5,Template">
  <title>Artinx Hub Frontend</title>

  <link rel="stylesheet" type="text/css" href="css/mdui.min.css" />
  <link rel="stylesheet" type="text/css" href="css/main.css" />

  <!--[if IE]>
    <script src="js/excanvas.js"></script><![endif]-->

  <script src="js/jquery-3.6.0.min.js"></script>
  <!-- <script src="js/echarts/echarts.js"></script> -->
  <script src="js/mdui.min.js"></script>

</head>

<body
  class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-bottom-nav-fixed mdui-theme-primary-indigo mdui-theme-accent-pink mdui-theme-layout-auto mdui-loaded"
  style="padding-bottom: 25vh">
  <div class="mdui-container-fluid">
    <!-- toolbar start -->
    <header class="mdui-appbar mdui-appbar-fixed">
      <div class="mdui-toolbar mdui-color-theme">
        <p class="mdui-typo-headline">ARTINX Hub</p>
        <div class="mdui-toolbar-spacer"></div>
        <button class="mdui-btn mdui-btn-icon" type="button" onclick="exitServer()">
          <i class="mdui-icon material-icons">exit_to_app</i>
        </button>
      </div>
    </header>
    <!-- drawer start -->
    <div class="mdui-drawer">
      <div class="mdui-list" id="filter">
        <div class="mdui-subheader">Filter</div>
      </div>
    </div>

    <!-- status start -->
    <!--    <div class="mdui-row">
      <div class="mdui-col-xs-12">
        <p><span>Status: </span><span id="current_status">Waiting for Server...</span></p>
      </div>
    </div>-->

    <!-- img start -->
    <div class="mdui-row">
      <div class="mdui-col-xs-8" id="images"></div>
      <div class="mdui-col-xs-4" id="watches">

        <table class="mdui-table" id="watchesTable"
          style="box-shadow: none!important; -webkit-box-shadow:none!important;">
          <tr>
            <th>数据曲线图</th>
            <th>名称</th>
            <th>值</th>
          </tr>
        </table>

        <div id="settings" class="mdui-panel" mdui-panel>
          <div class="mdui-panel-item">
            <div class="mdui-panel-item-header">
              <div class="mdui-panel-item-title">监视设置</div>
              <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
            </div>
            <div class="mdui-panel-item-body">
              <div class="mdui-row">
                <div class="mdui-col-xs-3">刷新频率</div>
                <div class="mdui-col-xs-9">
                  <label class="mdui-slider mdui-slider-discrete">
                    <input id="updateFreq" type="range" step="1" min="0" max="50" oninput="settings[this.id] = this.value"/>
                  </label>
                </div>
                <div class="mdui-col-xs-2 settingsDisplay"></div>
              </div>
              <div class="mdui-row">
                <div class="mdui-col-xs-3">记录长度</div>
                <div class="mdui-col-xs-9">
                  <label class="mdui-slider mdui-slider-discrete">
                    <input id="logLength" type="range" step="1" min="0" max="200" oninput="settings[this.id] = this.value"/>
                  </label>
                </div>
                <div class="mdui-col-xs-2 settingsDisplay"></div>
              </div>
            </div>
          </div>
        </div>
        <div style="width:100%; height: 2vh;"></div>

        <template id="trTemp">
          <tr>
            <td>
              <label class="mdui-checkbox">
                <input type="checkbox" onchange="$('#chart-'+$(this).parents('tr').children().eq(1).text()).toggle();">
                <i class="mdui-checkbox-icon"></i>
              </label>
            </td>
            <td></td>
            <td></td>
          </tr>
        </template>
        <template id="chartTemp">
          <div class="chart"></div>
        </template>

      </div>
    </div>
    <!-- log start >
    <div class="logs" id="logs">
    </div>
    <!-->
  </div>
  <script src="js/main.js" type="module"></script>
</body>

</html>
