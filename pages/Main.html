<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="author" content="Jony Zhu">
	<meta name="description" content="HTML5 Base Template.">
	<meta name="keywords" content="HTML5,Template">
	<title>Artinx Hub Frontend</title>
	<!--[if IE]><script src="js/excanvas.js"></script><![endif]-->
	<button type="button" onclick="exitServer()">Exit</button>
	<div class="current_status"></div>
	<img class="current_image" src=""></img>

	<script src="jquery-3.6.0.min.js"></script>
	<script>
		$(document).ready(function () {
		});
		function randomString(length) {
			var chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
			var result = '';
			for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
			return result;
		}
		function updateStatus() {
			jQuery.get("/status", function (data) {
				$(".current_status").html(`<p>${data}<p>`);
			}).fail(
				function () {
					$(".current_status").html(`<p>Disconnected<p>`);
				}
			);
			$('.current_image').attr('src', "/imgs?" + randomString(8));
		}
		function exitServer() {
			window.location.href = "/exit";
		}
		setInterval("updateStatus()", 30);
	</script>
	<link href="css/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
</body>

</html>
