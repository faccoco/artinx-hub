<!DOCTYPE html>

<head>
    <meta charset="utf8">
    <title>Artinx Hub Config Editor</title>
    <link rel="stylesheet" type="text/css" href="css/mdui.min.css"/>
    <link rel="stylesheet" type="text/css" href="css/main.css"/>
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/editor.js"></script>
</head>

<body
        class="mdui-drawer-body-left mdui-appbar-with-toolbar mdui-bottom-nav-fixed mdui-theme-primary-cyan mdui-theme-accent-pink mdui-theme-layout-auto mdui-loaded"
        style="padding-bottom: 25vh">
<div class="mdui-container-fluid">
    <!-- toolbar start -->
    <header class="mdui-appbar mdui-appbar-fixed">
        <div class="mdui-toolbar mdui-color-theme" id="top-bar">
            <p class="mdui-typo-headline">ARTINX Hub</p>
            <div class="mdui-toolbar-spacer"></div>
        </div>
    </header>
    <!--        <div class="mdui-row">-->
    <div class="mdui-drawer">
        <div class="mdui-list" id="control-area">
            <div class="mdui-subheader">Actions</div>
        </div>
    </div>
    <div class="mdui-col">
        <div class="mdui-textfield" id="text-editor"></div>
    </div>
    <div class="logs" id="logs">
    </div>
</body>
