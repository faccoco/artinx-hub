stages:
  - build
  - test
  - deploy

cache:
  key: "$CI_RUNNER_ID-$CI_COMMIT_SHA"
  paths:
    - build/*

build-job-windows:
  stage: build
  tags:
    - windows
  script:
    - cmake -G "Visual Studio 16 2019" -A x64 -B ./build -DARTINX_HUB_CAMERA=USB3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/WorkSpace/SDKS/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release

test-job:
  stage: test
  tags:
    - windows
  script:
    - cd build
    - ctest --build-config Release -j 8
  artifacts:
    name: "report"
    paths:
      - ./build/testResult.log
    expire_in: 1 month
    expose_as: "test report"

deploy-job-infantry1:
  stage: deploy
  tags:
    - linux 
    - infantry1
  script:
    - cmake -A x64 -B ./build -DARTINX_HUB_CAMERA=USB3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=~/workspace/package/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release
    - sudo python3 ./scripts/setup-service infantry1
  environment:
    name: infantry1
#   on_stop: stop-service
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

