stages:
  - format-check
  - clang-test
  - gnu-test
  - deploy

cache:
  key: "$CI_RUNNER_ID"
  untracked: true
format-check:
  stage: format-check
  tags:
    - linux-server
  script:
    - clang-format --dry-run --Werror **/*.cpp **/*.hpp

llvm-check:
  stage: clang-test
  tags:
    - linux-server
  script:
    - cd build-llvm/src && rm -rvf ./data ./pages ./scripts && cd ../../
    - cmake -B build-llvm -DARTINX_HUB_CAMERA=USB3 -DCMAKE_MAKE_PROGRAM=make -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/home/artinx/visual_SDK/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build-llvm --config Release -j 8
    - cd ./build-llvm && ctest --build-config Release -j 4
  artifacts:
    name: "clang-report"
    when: on_success
    paths:
      - "./build-llvm/Testing/Temporary/LastTest.log"
    expire_in: 1 month
    expose_as: "LLVM test report"

gnu-check:
  stage: gnu-test
  tags:
    - linux-server
  script:
    - cd build-gnu/src && rm -rvf ./data ./pages ./scripts && cd ../../
    - cmake -B build-gnu -DARTINX_HUB_CAMERA=USB3 -DCMAKE_MAKE_PROGRAM=make -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/home/artinx/visual_SDK/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build-gnu --config Release -j 8
    - cd ./build-gnu && ctest --build-config Release -j 4
  artifacts:
    name: "gcc-report"
    when: on_success
    paths:
      - "./build-gnu/Testing/Temporary/LastTest.log"
    expire_in: 1 month
    expose_as: "GNU test report"

deploy-job:
  stage: deploy
  tags:
    - linux
    - $DEPLOY_ID
  script:
    - source /opt/intel/openvino_2021/bin/setupvars.sh
    - cd build/src && rm -rvf ./data ./pages ./scripts && cd ../../
    - cmake -B ./build -DARTINX_HUB_CAMERA=$CAMERA_TYPE -DCMAKE_MAKE_PROGRAM=make -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release -j 6
    - sudo touch /opt/env_setup.sh
    - sudo bash ./scripts/setup-service.bash $DEPLOY_TARGET
    #- sudo bash ./scripts/close-service.bash
  environment:
    name: $DEPLOY_ID
  parallel:
    matrix:
      - DEPLOY_TARGET: "infantry"
        DEPLOY_ID: ["infantry1", "infantry2"]
        CAMERA_TYPE: "USB3"
      - DEPLOY_TARGET: "hero"
        DEPLOY_ID: ["hero", hero2]
        CAMERA_TYPE: "USB3"
      - DEPLOY_TARGET: "sentry"
        DEPLOY_ID: "sentry"
        CAMERA_TYPE: "USB3"
      # - DEPLOY_TARGET: "uav"
      #   DEPLOY_ID: "uav"
      #   CAMERA_TYPE: "USB2"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  dependencies: []
