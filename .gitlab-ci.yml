stages:
  - build
  - test
  - deploy

cache:
  key: "$CI_RUNNER_ID"
  untracked: true

build-job:
  stage: build
  tags:
    - linux-server
  script:
    - cmake -B ./build -DARTINX_HUB_CAMERA=USB3 -DCMAKE_MAKE_PROGRAM=make -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/home/artinx/Desktop/workspace/packages/vcpkg/scripts/buildsystems/vcpkg.cmake
    #- cmake -A x64 -B ./build -DARTINX_HUB_CAMERA=USB3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/home/artinx/Desktop/workspace/packages/vcpkg/scripts/buildsystems/vcpkg.cmake
    - source /opt/intel/openvino_2021/bin/setupvars.sh
    - cmake --build ./build --config Release

test-job:
  stage: test
  tags:
    - linux-server
  script:
    - cd build
    - Get-ChildItem * -Include *.log -Recurse | Remove-Item
    - ctest --build-config Release -j 8
  artifacts:
    name: "report"
    paths:
      - ./build/testResult.log
    expire_in: 1 month
    expose_as: "test report"

deploy-job:
  stage: deploy
  tags:
    - linux
    - $DEPLOY_ID
  script:
    - source /opt/intel/openvino_2021/bin/setupvars.sh
    - cmake -B ./build -DARTINX_HUB_CAMERA=$CAMERA_TYPE -DCMAKE_MAKE_PROGRAM=make -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release -j 6
    - sudo touch /opt/env_setup.sh
    - sudo bash ./scripts/setup-service.bash $DEPLOY_TARGET
  environment:
    name: $DEPLOY_ID
  parallel:
    matrix:
      - DEPLOY_TARGET: "infantry"
        DEPLOY_ID: ["infantry1", "infantry2"]
        CAMERA_TYPE: "USB3"
      - DEPLOY_TARGET: "hero"
        DEPLOY_ID: "hero"
        CAMERA_TYPE: "USB3"
      - DEPLOY_TARGET: "sentry"
        DEPLOY_ID: "sentry"
        CAMERA_TYPE: "USB2"
      # - DEPLOY_TARGET: "uav"
      #   DEPLOY_ID: "uav"
      #   CAMERA_TYPE: "USB2"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  dependencies: []
