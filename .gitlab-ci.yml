stages:
  - build
  - test

build-job:
  stage: build
  script:
    - cmake.exe -G "Visual Studio 16 2019" -A x64 -B ./build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/WorkSpace/SDKS/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake.exe --build ./build --config Release

unit-test-job:
  stage: test
  script:
    - ctest.exe --build-config Release --output-on-failure -j 8
