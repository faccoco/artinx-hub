stages:
  - build
  - test
  - deploy

build-job-windows:
  stage: build
  script:
    - cmake -G "Visual Studio 16 2019" -A x64 -B ./build -DARTINX_HUB_CAMERA=USB3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/WorkSpace/SDKS/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release
  rules:
    - if: $DEPLOY_TARGET == null

build-job-linux:
  stage: build
  script:
    - cmake -A x64 -B ./build -DARTINX_HUB_CAMERA=$USB_TYPE -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=~/workspace/package/vcpkg/scripts/buildsystems/vcpkg.cmake
    - cmake --build ./build --config Release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_TARGET != null
    - if: $DEPLOY_TARGET == "Sentry"
      variables:
        USB_TYPE: "USB2"
    - if: $DEPLOY_TARGET != "Sentry"
      variables:
        USB_TYPE: "USB3"

test-job:
  stage: test
  script:
    - cd build
    - ctest --build-config Release -j 8
  artifacts:
    name: "report"
    paths:
      - ./build/testResult.log
    expire_in: 1 month
    expose_as: "test report"
  rules:
    - if: $DEPLOY_TARGET == null

