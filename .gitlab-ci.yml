stop-service:
  stage: deploy
  tags:
    - linux
  script:
    - sudo python3 ./scripts/teardown-service.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_TARGET != null
