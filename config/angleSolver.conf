global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}

server {
  type = "HttpServer"
}
camera {
    type = "DahengDriver"
    openMode = "SerialNumber"
    identifier = "KE0200080465"
    fps = 100.0
    fov = 41.0
    exposureTime = 0.01
    binning = 0
    width = 640
    height = 480
    image_frame_atom = ["detector","server"]
}

detector {
    type = "FakeCarDetector"
    car_detect_available_atom = ["armor_detector"]
}

armor_detector {
  type = "ArmorDetector"
  isRed = true
  globalScale = 1.0
  thresholdForBlue = [120,256,256]
  thresholdForRed = [40,256,256]
  maxAreaRatio = 2.0
  maxLightAngle = 0.3
  maxLightRectRatio = 10.0
  maxArmorRectRatio = 1.7
  maxArmorAngle = 0.8
  minLightBaseAngle = 0.3
  maxParallelAngle = 0.7
  minLightHeightRatio = 0.6
  armor_detect_available_atom = ["armor_locator", "drawer"]
  image_frame_atom = ["server"]
}

drawer {
  type = "ArmorDetectorDrawer"
  image_frame_atom = ["server"]
}

armor_locator {
  type = "ArmorLocator"
  detect_available_atom = ["sentry"]
}

sentry {
    type = "SentryStrategy"
    distanceThreshold = 0.0
    set_target_atom = ["solver"]
}

solver {
  type = "AngleSolver"
  precision = 0.001
  set_target_info_atom = ["serial"]
}

serial {
  type = "SerialPort"
  devPath = "/dev/ttyUSB0"
  baudRate = 921600
  headHeightOffset = 0.0
  update_head_atom = ["solver"]
  update_posture_atom = ["solver"]
}