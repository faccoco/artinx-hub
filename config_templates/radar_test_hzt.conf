radar-detector{
    type = "RadarNNetDetector"
    modelPath = "/home/hzt/workspace/model/new.engine"
    carConfidence=0.7
    armorConfidence=0.0
    greenThreshold=150
    selfRed=false
    image_frame_atom = ["server"]
    bot_locate_request_atom=["bot-locator"]
}

bot-locator{
    type = "BotLocator"
    selfRed=false
    mapPath="/home/hzt/workspace/model/map.png"
    rivalRHeightOffset=2
    rivalRoundHeightOffset=2
    selfRHeightOffset=1.5
    selfRoundHeightOffset=1.5
    image_frame_atom=["server"]
    sync_position_atom=["judge-system"]
}

radar-locator{
    type = "RadarLocator"
}

server{
    type = "HttpServer"
    enableRadar = true
    radar_locate_request_atom = ["radar-locator"]
}

judge-system{
    type = "PosSynchronization"
    devPath="/dev/ttyACM0"
    baudRate=115200
}

