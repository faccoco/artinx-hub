global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}

camera {
    type = "DahengDriver"
    openMode = "Index"
    cameraName="RadarCenter"
    identifier = 1
    fps = 30.0
    fov = 30.0
    exposureTime = 0.008
    gain=14
    enableAutoWhiteBalance=true
    enableAutoWhiteBalance = true
    dy = 0.05 # TODO
    dz = -0.06 # TODO
    image_frame_atom = ["radar-detector","server"]
}

