armor_locator {
    type = "ArmorLocator"
    ratioThreshold = 3.0
    largeArmor = [1]
}

server {
    type = "HttpServer"
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

