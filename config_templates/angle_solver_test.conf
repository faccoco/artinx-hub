global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 15.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 1.5
  bulletCount = 10

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 0.0

  standardDistance = 3.4
  sourceHeight = 0.15
  targetHeight = 0.15

  targetType = "Infantry"
  targetMotionType = "Static"
  sourceMotionType = "Static"

  expectedCount = 10
  
  headHeightOffset = 0.2

  simulator_step_atom = ["detector"]
  update_head_atom = ["solver","detector"]
  update_posture_atom = ["solver"]
}
detector {
  type = "FakeDetector"
  delay = 0.0
  detectLinearStd = 0.0
  
  detect_available_atom = ["strategy"]
}
solver {
  type = "AngleSolver"
  precision = 0.001
  delay = 0.2
  errEstimate = [0.0, 0.0, 0.0]
  errMeasure  = [1.0, 1.0, 1.0]
  set_target_info_atom = ["simulator"]
}
strategy {
  type = "SimpleStrategy"
  set_target_atom = ["solver"]
}
