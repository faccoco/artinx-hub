armor_detector {
    type = "TensorRTDetector"
    debugView = false
    onnxPath = "data/weights/armor_detect/best_trt.onnx"
    numThresh = 0.7
    # armor_detect_available_atom = ["drawer"]
    # armor_detect_available_atom = ["drawer"]

    image_frame_atom = ["server"]
    armor_detect_available_atom = ["drawer", "armor_locator"]
}

armor_locator {
    type = "ArmorLocator"
    largeArmor = [1]
    # detect_available_atom = ["strategy"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}


