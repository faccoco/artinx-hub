global {
#     gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
#     gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

server {
    type = "HttpServer"
    ethName = "eth0"
}

camera {
    type = "HikDriver"
    openMode = "Index"
    identifier = 1
    fps = 210.0
    fov = 30.0
    enableAutoWhiteBalance = true
    exposureTime = 0.03
    dx = -0.06
    dy = 0.06 # TODO
    dz = -0.1
    yaw = 0.7
    pitch = 0
    gain = 15
    image_frame_atom = ["armor_detector","server"]
}

