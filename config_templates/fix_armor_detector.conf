armor_detector {
    type = "ArmorDetector"
    debugView = true
    binaryThresh = 100
    maxLightLen = 50
    minLightRectRatio = 0.1   # width/height
    maxLightRectRatio = 0.6   # width/height
    maxLightAngle = 20        # angle(degree)
    min2lightLenRatio = 0.6   # light1.height / light2.height
    minArmorRectRatio = 0.8   # width/height
    maxArmorRectRatio = 5.0   # width/height
    maxArmorAngle = 10        # angle(degree)
    minLargeArmorRatio = 3.2  # width / height
    numClassifyModelPath = "data/weights/armor_classify/fc.onnx"
    numProbThresh = 0.7
    armor_detect_available_atom = ["drawer"]
    image_frame_atom = ["server"]
}

drawer {
    type = "ArmorDetectorDrawer"
    image_frame_atom = ["server"]
}

server {
    type = "HttpServer"
}
