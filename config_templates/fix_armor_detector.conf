global {
  # gForce = -9.8 # General
    gForce = -9.7949 # Nanjing(near to Changzhou)
  # gForce = -9.7833 # Guangzhou(near to Shenzhen)
    dragCoefficient = 0.0
    bullet42mm = false
}

camera {
  type = "DahengDriver"
  openMode = "Index"
  identifier = 1
  fps = 210.0
  fov = 30.0
  exposureTime = 0.008
  dx = 0.054 # TODO
  dy = 0.085 # TODO
  dz = -0.085 # TODO
  pitch = -20
  enableAutoWhiteBalance = true
#   image_frame_atom = ["armor_detector","server","recorder"]
  image_frame_atom = ["armor_detector","server"]
}

