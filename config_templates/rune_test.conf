rune_detector {
    type = "RuneDetector"
    debugView = true

    # bound for hsv
    lowerRed = [0, 0, 0]
    upperRed = [180, 255, 255]
    lowerBlue = [70, 0, 40]
    upperBlue = [180, 255, 255]
    binThresh = 10

    roiBinThresh = 150

    dilateKernel = 13
    minConvexHullThresh = 0.6  # for hull area ratio filter
    maxConvexHullThresh = 0.85
    minContourArea = 100         # for contour area filter

    rRoiSizeScale = 1.0

    rPosScale = 8.3
    energy_detect_available_atom = ["energy_predictor"]
    image_frame_atom = ["server"]
}

energy_predictor{
    type = "EnergyPredictor"
    fanQueueLength = 20
    Qw = 0.08
    Qtheta = 0.08
    Qxyz = 0.08
    Qyaw = 0.08
    Rtheta = 0.4
    Rxyz = 0.05
    Ryaw = 0.4
    lostCnt = 20
    set_target_info_atom = ["serial"]
    # set_target_info_atom = []
}

server {
    type = "HttpServer"
}
serial {
    type = "InfantrySerialPort"
    devPath = "/dev/ttyUSB0"
    baudRate = 921600
    update_head_atom = ["camera"]
}
