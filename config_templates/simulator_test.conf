global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}
simulator {
  type = "Simulator"
  step = 0.001
  v0 = 25.0
  v0Std = 0.0
  shootInterval = 0.1

  maxTime = 12.0
  bulletCount = 100

  vibrationLinearRange = 0.0 
  vibrationAngleRange = 0.0
  spinningSpeed = 0.1

  standardDistance = 5.0
  sourceHeight = 1.45
  targetHeight = 0.15

  targetType = "Infantry"
  targetMotionType = "Static"
  sourceMotionType = "Sentry"

  expectedCount = 85
  
  headHeightOffset = 0.2

  simulator_step_atom = ["detector"]
  update_head_atom = ["predictor","detector"]
  update_posture_atom = ["predictor"]
}
detector {
  type = "FakeDetector"
  
  detect_available_atom = ["strategy"]
}

predictor {
    type = "ArmorPredictor"
    enalePredictor = false
    predict_success_atom = ["solver"]
}
solver {
  type = "AngleSolver"
  delay = 0.0
  set_target_info_atom = ["simulator"]
}
strategy {
  type = "SimpleStrategy"
  set_target_atom = ["predictor"]
}