global {
  gForce = -9.8
  dragCoefficient = 0.0
  bullet42mm = false
}
video_replay {
  type = "VideoReplay"
  path = <video path>
  fps = 30.0
  fov = <fov>
  width = 640
  height = 480
  image_frame_atom = ["car_detector"]
}
car_detector {
  type = "CarDetector"
  inputWidth = 320
  inputHeight = 192
  xmlPath = "data/weights/car300_nano/car300_nano.xml"
  binPath = "data/weights/car300_nano/car300_nano.bin"
  nmsThreshold = 0.6
  boundingBoxThreshold = 0.7
  deviceName = "CPU"
  numClasses = 1
  carId = 0
  car_detect_available_atom = ["car_detector_drawer"]
}
car_detector_drawer {
  type = "CarDetectorDrawer"
  image_frame_atom = ["server"]
}
server {
  type = "HttpServer"
}
